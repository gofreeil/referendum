<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Google Analytics — נכס משותף לכל אתרי "יוצאים לחירות". ההפרדה בין
		     האתרים נעשית לפי hostName, ולכן אותו מזהה משמש את כולם. -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTEG7S0H9N"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-YTEG7S0H9N');
		</script>
		<!-- המודעות נטענות בצד-הלקוח (adSlots.ts); ה-preload משגר את הבקשה
		     מוקדם ככל האפשר, עוד לפני שה-JS נטען. -->
		<link rel="preload" href="/api/ads/approved" as="fetch" crossorigin="anonymous" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
